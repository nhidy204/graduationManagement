version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: thesis_mongo
    restart: unless-stopped
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: thesis_db

  server:
    build:
      context: ./thesis-server
      dockerfile: Dockerfile
    container_name: thesis_server
    restart: unless-stopped
    ports:
      - '3001:3001'
    environment:
      - NODE_ENV=development
      - PORT=3001
      - MONGODB_URI=mongodb://mongodb:27017/thesis_db
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - JWT_REFRESH_EXPIRES_IN=${JWT_REFRESH_EXPIRES_IN}
      - CLIENT_URL=${CLIENT_URL}
    depends_on:
      - mongodb
    volumes:
      - ./thesis-server:/app
      - /app/node_modules

volumes:
  mongo_data: